server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        secure: true
springdoc:
  api-docs:
    enabled: false
logging:
  file:
    name: ${ERP_LOG_FILE:./logs/erp-server.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 2GB
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
