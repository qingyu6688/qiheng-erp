spring:
  application:
    name: erp-server
  profiles:
    default: prod
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:erp_dev}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&sslMode=${DB_SSL_MODE:DISABLED}&rewriteBatchedStatements=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_REPEATABLE_READ
      data-source-properties:
        # 缓存重复 SQL 的驱动解析结果，权限和业务数据仍逐次查询。
        cachePrepStmts: true
        prepStmtCacheSize: 128
        prepStmtCacheSqlLimit: 8192
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}
      timeout: 3s
  session:
    timeout: 30m
    redis:
      namespace: erp:session:${APP_ENV:prod}
      flush-mode: on_save
      save-mode: on_set_attribute
  flyway:
    clean-disabled: true
    user: ${DB_MIGRATION_USER:}
    password: ${DB_MIGRATION_PASSWORD:}
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:200}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: ERPSESSION
        http-only: true
        same-site: lax
        secure: true
springdoc:
  api-docs:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

erp:
  websocket:
    allowed-origins: ${ERP_WEBSOCKET_ALLOWED_ORIGINS:}
