spring:
  application:
    name: erp-server
  profiles:
    default: prod
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:erp_dev}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_REPEATABLE_READ
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}
      timeout: 3s
  session:
    timeout: 30m
    redis:
      namespace: erp:session:${APP_ENV:prod}
  flyway:
    clean-disabled: true
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: ERPSESSION
        http-only: true
        same-site: lax
        secure: true
springdoc:
  api-docs:
    enabled: false
  paths-to-match: /api/v1/**
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
