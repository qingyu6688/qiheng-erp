erp:
  worker:
    enabled: false
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${TEST_DB_NAME:erp_test}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${TEST_DB_USER}
    password: ${TEST_DB_PASSWORD}
  session:
    redis:
      namespace: erp:session:test
server:
  servlet:
    session:
      cookie:
        secure: false
