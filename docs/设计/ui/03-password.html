<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>修改密码</title>
<link rel="stylesheet" href="assets/erp-ui.css">
</head>
<body data-nav="" data-crumb="账户 / 修改密码">
<main id="page">
  <div class="page-head"><div class="title"><h1>修改密码</h1><span class="muted">账号 lina · 上次修改 2026-08-02</span></div></div>

  <div class="alert alert-warning" style="max-width:560px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><div><strong>管理员已重置你的密码</strong><div>修改后才能继续使用系统。此时左侧菜单隐藏，只保留本页和“退出登录”。</div></div></div>

  <form class="panel" style="max-width:560px">
    <div class="panel-body">
      <div class="field"><label for="old">当前密码 <span class="req">*</span></label><input id="old" class="input" type="password" autocomplete="current-password"></div>
      <div class="field"><label for="new">新密码 <span class="req">*</span></label><input id="new" class="input" type="password" autocomplete="new-password" aria-describedby="new-hint"><span id="new-hint" class="hint">至少 8 位，包含字母和数字，不能与当前密码相同。</span></div>
      <div class="field"><label for="again">再次输入新密码 <span class="req">*</span></label><input id="again" class="input invalid" type="password" autocomplete="new-password" aria-invalid="true" aria-describedby="again-err"><span id="again-err" class="error-text">两次输入的新密码不一致</span></div>
    </div>
    <div class="panel-foot"><span class="hint">修改成功后，其他设备上的登录会失效。</span><button class="btn btn-primary" type="submit">保存新密码</button></div>
  </form>

  <aside class="spec-note">
    <strong>设计说明</strong>
    <ul>
      <li>对应 <code>pages/PasswordPage.vue</code>。“修改密码”入口从左侧菜单移到右上角账户菜单（原优化项 O-12）。</li>
      <li>强制修改状态由 <code>/auth/me</code> 的 <code>mustChangePassword</code> 决定，现有路由守卫已处理，本稿补充顶部提示条。</li>
      <li>密码规则以后端校验为准，前端只做即时提示。</li>
    </ul>
  </aside>
</main>
<script src="assets/shell.js"></script>
</body>
</html>
