global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yaml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: erp
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: [api:9091]
        labels:
          role: api
      - targets: [worker:9091]
        labels:
          role: worker
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
