# 模板需要先设置私有 .env、证书、各镜像的固定摘要；不会自动生成生产口令。
x-logging: &erp-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "14"
services:
  mysql-primary:
    image: mysql:8.0.46
    restart: unless-stopped
    logging: *erp-logging
    command: [mysqld, --bind-address=0.0.0.0, --slow-query-log-file=/var/lib/mysql/slow.log]
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets: [mysql_root_password]
    volumes:
      - mysql-primary:/var/lib/mysql
      - ./mysql-primary.cnf:/etc/mysql/conf.d/erp.cnf:ro
      - ./private/mysql-tls:/etc/mysql/tls:ro
    networks: [data]
  mysql-replica:
    image: mysql:8.0.46
    restart: unless-stopped
    logging: *erp-logging
    command: [mysqld, --bind-address=0.0.0.0, --slow-query-log-file=/var/lib/mysql/slow.log]
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets: [mysql_root_password]
    volumes:
      - mysql-replica:/var/lib/mysql
      - ./mysql-replica.cnf:/etc/mysql/conf.d/erp.cnf:ro
      - ./private/mysql-tls:/etc/mysql/tls:ro
    networks: [data]
  redis:
    image: ${REDIS_IMAGE:?请设置已审阅的固定版本及摘要}
    restart: unless-stopped
    logging: *erp-logging
    command: [redis-server, /usr/local/etc/redis/redis.conf, --bind, 0.0.0.0, --logfile, ""]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./private/redis-tls:/etc/redis/tls:ro
      - ./private/redis-users.acl:/etc/redis/users.acl:ro
      - redis-data:/var/lib/redis
    networks: [data]
  api:
    image: ${ERP_IMAGE:?请设置已构建校验的ERP镜像摘要}
    restart: unless-stopped
    logging: *erp-logging
    env_file: ./private/api.env
    mem_limit: 2g
    volumes:
      - ./private/client-tls:/etc/erp/client-tls:ro
      - application-logs:/var/log/erp
    environment:
      SERVER_ADDRESS: 0.0.0.0
      ERP_NODE_ID: 10
      ERP_WORKER_ENABLED: "false"
      ERP_HTTP_LOG_FILE: /var/log/erp/api-http.log
    networks: [web, data]
  worker:
    image: ${ERP_IMAGE:?请设置已构建校验的ERP镜像摘要}
    restart: unless-stopped
    logging: *erp-logging
    env_file: ./private/worker.env
    mem_limit: 2g
    volumes:
      - ./private/client-tls:/etc/erp/client-tls:ro
      - application-logs:/var/log/erp
    environment:
      SERVER_ADDRESS: 127.0.0.1
      ERP_NODE_ID: 11
      ERP_WORKER_ENABLED: "true"
      ERP_LOG_FILE: /var/log/erp/worker.log
      ERP_HTTP_LOG_FILE: /var/log/erp/worker-http.log
    networks: [web, data]
  nginx:
    image: ${NGINX_IMAGE:?请设置已审阅的固定版本及摘要}
    restart: unless-stopped
    logging: *erp-logging
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./private/tls:/etc/nginx/tls:ro
      - ../web:/usr/share/nginx/html:ro
    networks: [web]
networks:
  web: {}
  data:
    internal: true
volumes:
  mysql-primary: {}
  mysql-replica: {}
  redis-data: {}
  application-logs: {}
secrets:
  mysql_root_password:
    file: ./private/mysql-root-password
