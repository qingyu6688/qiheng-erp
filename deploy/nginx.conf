user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format erp '$remote_addr $request_method $uri $status $request_time request_id=$upstream_http_x_request_id';
  access_log /var/log/nginx/access.log erp;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 21m;
  upstream erp_api { server api:8080; keepalive 32; }
  server { listen 80; return 308 https://$host$request_uri; }
  server {
    listen 443 ssl;
    server_name erp.example.invalid;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    root /usr/share/nginx/html;
    location /actuator { return 404; }
    location ~ /(?:\.env|private-objects|objects|backups|logs)(?:/|$) { return 404; }
    location /api/ {
      proxy_pass http://erp_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 5s;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
