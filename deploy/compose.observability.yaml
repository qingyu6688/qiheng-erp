# 与 compose.yaml 合并使用，私有配置的准备步骤见运维手册。
x-monitoring-logging: &monitoring-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "7"
services:
  api:
    volumes:
      - ./private/opentelemetry-javaagent.jar:/opt/otel/agent.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: prod,observability
      ERP_MANAGEMENT_ADDRESS: 0.0.0.0
      ERP_MANAGEMENT_PORT: 9091
      ERP_SERVICE_ROLE: api
      ERP_LOG_FILE: /var/log/erp/api.log
      JAVA_TOOL_OPTIONS: -javaagent:/opt/otel/agent.jar
      OTEL_SERVICE_NAME: qiheng-erp-api
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.1"
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_JDBC_STATEMENT_SANITIZER_ENABLED: "true"
    networks: [web, data, monitoring]
  worker:
    volumes:
      - ./private/opentelemetry-javaagent.jar:/opt/otel/agent.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: prod,observability
      ERP_MANAGEMENT_ADDRESS: 0.0.0.0
      ERP_MANAGEMENT_PORT: 9091
      ERP_SERVICE_ROLE: worker
      JAVA_TOOL_OPTIONS: -javaagent:/opt/otel/agent.jar
      OTEL_SERVICE_NAME: qiheng-erp-worker
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.1"
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_JDBC_STATEMENT_SANITIZER_ENABLED: "true"
    networks: [web, data, monitoring]
  prometheus:
    image: prom/prometheus:v3.16.0
    logging: *monitoring-logging
    restart: unless-stopped
    command: [--config.file=/etc/prometheus/prometheus.yaml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=15d]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - ./private/metrics-token:/run/secrets/metrics-token:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [monitoring]
  alertmanager:
    image: prom/alertmanager:v0.35.0
    logging: *monitoring-logging
    restart: unless-stopped
    command: [--config.file=/etc/alertmanager/alertmanager.yaml, --storage.path=/alertmanager]
    volumes:
      - ./private/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    networks: [monitoring]
  tempo:
    image: grafana/tempo:2.9.0
    logging: *monitoring-logging
    restart: unless-stopped
    command: [-config.file=/etc/tempo.yaml]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [monitoring]
  loki:
    image: grafana/loki:3.7.10
    logging: *monitoring-logging
    restart: unless-stopped
    command: [-config.file=/etc/loki/local-config.yaml]
    volumes:
      - ./observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks: [monitoring]
  alloy:
    image: grafana/alloy:v1.22.0
    logging: *monitoring-logging
    restart: unless-stopped
    command: [run, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - application-logs:/var/log/erp:ro
      - alloy-data:/var/lib/alloy
    networks: [monitoring]
  grafana:
    image: grafana/grafana:13.3.1
    logging: *monitoring-logging
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./private/grafana-password:/run/secrets/grafana-password:ro
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/erp.yaml:ro
      - ./observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/erp.yaml:ro
      - ./observability/dashboards:/etc/grafana/erp-dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    networks: [monitoring]
  node-exporter:
    image: prom/node-exporter:v1.12.1
    logging: *monitoring-logging
    restart: unless-stopped
    command: [--path.rootfs=/host, --collector.textfile.directory=/textfile]
    pid: host
    volumes:
      - /:/host:ro,rslave
      - ./private/textfile:/textfile:ro
    networks: [monitoring]
networks:
  monitoring: {}
volumes:
  prometheus-data: {}
  alertmanager-data: {}
  tempo-data: {}
  loki-data: {}
  alloy-data: {}
  grafana-data: {}
