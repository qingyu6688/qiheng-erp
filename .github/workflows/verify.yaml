name: 构建与回归
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: JDK21 / MySQL8.0.46 / 浏览器回归
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_DATABASE: erp_test
          MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.4.7
        ports: ['6380:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=5s --health-retries=20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 准备 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
          cache: npm
          cache-dependency-path: erp-web/package-lock.json
      - name: 写入独立测试环境
        shell: pwsh
        env:
          CI_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          @(
            'APP_ENV=ci'
            "JAVA_HOME=$env:JAVA_HOME"
            'SERVER_PORT=8080'
            'DB_HOST=127.0.0.1'
            'DB_PORT=3306'
            'DB_NAME=erp_ci_unused'
            'DB_USER=root'
            "DB_PASSWORD=$env:CI_DB_PASSWORD"
            'TEST_DB_NAME=erp_test'
            'TEST_DB_USER=root'
            "TEST_DB_PASSWORD=$env:CI_DB_PASSWORD"
            'REDIS_HOST=127.0.0.1'
            'REDIS_PORT=6380'
            'REDIS_PASSWORD='
          ) | Set-Content -LiteralPath .env -Encoding utf8NoBOM
      - name: 后端测试与构建
        shell: pwsh
        run: ./scripts/project.ps1 verify
      - name: 前端检查与构建
        working-directory: erp-web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium
      - name: 浏览器回归
        shell: pwsh
        run: ./scripts/project.ps1 e2e
      - name: 保存失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 回归失败报告
          retention-days: 7
          path: |
            erp-server/target/surefire-reports/*.txt
            erp-server/target/failsafe-reports/*.txt
            erp-web/playwright-report/
            erp-web/test-results/
