name: 构建与回归
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-dependencies:
    name: 依赖安全扫描与 SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
      - name: 生成运行依赖清单
        shell: pwsh
        run: ./scripts/security-sbom.ps1 -OutputDirectory "$env:RUNNER_TEMP/sbom"
      - name: 检查扫描门禁回归
        run: python3 -B -m unittest discover -s scripts -p test_security_gate.py
      - name: 核对漏洞与严重级别
        shell: bash
        run: |
          set -euo pipefail
          archive=trivy_0.76.2_Linux-64bit.tar.gz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/$archive"
          printf '%s  %s\n' 'bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf' "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
          mkdir -p "$RUNNER_TEMP/trivy-reports"
          for bom in "$RUNNER_TEMP"/sbom/*.cdx.json; do
            "$RUNNER_TEMP/trivy" --quiet --cache-dir "$RUNNER_TEMP/trivy-cache" sbom \
              --no-progress --list-all-pkgs --scanners vuln --format json \
              --output "$RUNNER_TEMP/trivy-reports/$(basename "$bom")" "$bom"
          done
          python3 -B scripts/security_gate.py dependency "$RUNNER_TEMP"/trivy-reports/*.json
      - name: 保存清单与扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 安全扫描与运行依赖清单
          retention-days: 14
          path: |
            ${{ runner.temp }}/sbom/
            ${{ runner.temp }}/trivy-reports/
  security-code:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - '**/src/test/**'
              - '**/tests/**'
              - '**/e2e/**'
              - '**/*.test.*'
              - '**/*.spec.*'
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          output: ${{ runner.temp }}/codeql-results
          category: /language:${{ matrix.language }}
      - name: 核对静态扫描严重级别
        run: python3 -B scripts/security_gate.py code "$RUNNER_TEMP"/codeql-results/*.sarif
  public-repository-scan:
    name: 公开仓库敏感信息扫描
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 扫描提交中的密钥
        shell: bash
        run: |
          set -euo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${archive}"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-level=warn --log-opts=--all .
      - name: 检查部署资料
        run: |
          python3 -m unittest discover -s scripts -p test_public_deployment.py
          python3 scripts/check_public_deployment.py
  verify:
    name: JDK21 / MySQL8.0.46 / 浏览器回归
    runs-on: ubuntu-latest
    # 完整回归包含后端、AI、两端构建和浏览器，需容纳冷缓存及慢速运行器。
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_DATABASE: erp_test
          MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.4.7
        ports: ['6380:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=5s --health-retries=20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 准备 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 配置 CI 依赖镜像
        shell: pwsh
        run: |
          $mavenSettingsPath = Join-Path ([Environment]::GetFolderPath('UserProfile')) '.m2/settings.xml'
          @'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <name>Google 托管的 Maven Central 镜像</name>
                <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          '@ | Set-Content -LiteralPath $mavenSettingsPath -Encoding utf8NoBOM
      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
          cache: npm
          cache-dependency-path: |
            erp-web/package-lock.json
            erp-mobile/package-lock.json
      - name: 写入独立测试环境
        shell: pwsh
        env:
          CI_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ciLoginSettingsKey = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          Write-Output "::add-mask::$ciLoginSettingsKey"
          @(
            'APP_ENV=ci'
            "JAVA_HOME=$env:JAVA_HOME"
            'SERVER_PORT=8080'
            'DB_HOST=127.0.0.1'
            'DB_PORT=3306'
            'DB_NAME=erp_ci_unused'
            'DB_USER=root'
            "DB_PASSWORD=$env:CI_DB_PASSWORD"
            'TEST_DB_NAME=erp_test'
            'TEST_DB_USER=root'
            "TEST_DB_PASSWORD=$env:CI_DB_PASSWORD"
            'REDIS_HOST=127.0.0.1'
            'REDIS_PORT=6380'
            'REDIS_PASSWORD='
            "ERP_LOGIN_SETTINGS_KEY=$ciLoginSettingsKey"
          ) | Set-Content -LiteralPath .env -Encoding utf8NoBOM
      - name: 后端测试与构建
        shell: pwsh
        run: ./scripts/project.ps1 verify
      - name: 升级工具回归
        shell: bash
        run: |
          sh -n scripts/upgrade-2.0.sh
          python3 -B -m unittest discover -s scripts/upgrade-2.0 -p 'test_*.py'
      - name: 总账采集工具回归
        env:
          ERP_TEST_ROOT: ${{ runner.temp }}/gl-tool-tests
        run: python3 -B -m unittest discover -s scripts/load -p 'test_gl_*.py'
      - name: 校验 AI 容器组合配置
        shell: bash
        env:
          ERP_IMAGE: erp-server:ci
          ERP_AI_IMAGE: erp-ai:ci
          REDIS_IMAGE: redis:7.4.7
          NGINX_IMAGE: nginx:ci
        run: |
          set -euo pipefail
          compose_check="$(mktemp -d "$RUNNER_TEMP/erp-compose.XXXXXX")"
          cp deploy/{compose.yaml,compose.ai.yaml,compose.ai.search.yaml} "$compose_check/"
          mkdir "$compose_check/private"
          touch "$compose_check/private/"{api.env,worker.env,ai.env}
          docker compose -f "$compose_check/compose.yaml" -f "$compose_check/compose.ai.yaml" -f "$compose_check/compose.ai.search.yaml" \
            config --no-env-resolution --quiet
      - name: AI 服务测试与构建
        shell: bash
        env:
          CI_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          CI_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          export ERP_AI_DB_PASSWORD="$(openssl rand -hex 24)"
          export ERP_AI_SIGNING_KEY="$(openssl rand -hex 32)"
          export ERP_AI_PROVIDER_KEY="$(openssl rand -base64 32)"
          printf '::add-mask::%s\n' "$ERP_AI_DB_PASSWORD" "$ERP_AI_SIGNING_KEY" "$ERP_AI_PROVIDER_KEY"
          docker exec -i -e MYSQL_PWD="$CI_DB_PASSWORD" "$CI_MYSQL_CONTAINER" mysql -uroot <<SQL
          CREATE DATABASE erp_ai_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
          CREATE USER 'erp_ai_ci'@'%' IDENTIFIED BY '$ERP_AI_DB_PASSWORD';
          GRANT ALL PRIVILEGES ON erp_ai_test.* TO 'erp_ai_ci'@'%';
          SQL
          export ERP_AI_DB_URL='jdbc:mysql://127.0.0.1:3306/erp_ai_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&sslMode=REQUIRED'
          export ERP_AI_DB_USER=erp_ai_ci
          export ERP_AI_SEARCH_MODE=local
          export ERP_AI_KB_STORAGE="$RUNNER_TEMP/erp-ai-knowledge"
          mvn -B -f erp-ai/pom.xml verify
      - name: 前端检查与构建
        working-directory: erp-web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium
      - name: 移动端检查与构建
        working-directory: erp-mobile
        run: |
          npm ci
          npm run lint
          npm run type-check
          npm test
          npm run build:h5
          npm run build:app
      - name: 浏览器回归
        shell: pwsh
        run: ./scripts/project.ps1 e2e
      - name: 保存失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 回归失败报告
          retention-days: 7
          path: |
            erp-server/target/surefire-reports/*.txt
            erp-server/target/failsafe-reports/*.txt
            erp-ai/target/surefire-reports/*.txt
            erp-ai/target/failsafe-reports/*.txt
            erp-web/playwright-report/
            erp-web/test-results/
